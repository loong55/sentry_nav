controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: odometry
    publish_critics_stats: True
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 999.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20   #目标点容忍值
      yaw_goal_tolerance: 6.28
      path_length_tolerance: 0.5

    FollowPath:
      plugin: "goal_approach_controller::GoalApproachController"
      inner_plugin: "nav2_mppi_controller::MPPIController"
      approach_distance: 0.8    #距目标时开始限速
      approach_velocity: 0.5    #限速速度
      direct_approach_distance: 0.5   #进入直接驱动模式的距离，绕过MPPI防止画弧
      direct_approach_kp: 3.0   #直接驱动P控制增益
      time_steps: 80
      model_dt: 0.06      #稍微放大步长，配合time_steps延长预测时域
      batch_size: 1500    #控制器的采样数。

      vx_std: 0.35
      vy_std: 0.35   # 走直线
      wz_std: 0.2

      vx_max: 2.5
      vy_max: 2.5   # 走直线
      wz_max: 1.5

      vx_min: -2.5
      vy_min: -2.5 # 走直线
      wz_min: -1.5

      ax_max: 1.5
      ay_max: 1.5
      az_max: 3.0

      ax_min: -3.5
      ay_min: -3.5
      az_min: -3.0

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.25
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      reset_period: 0.08
      retry_attempt_limit: 2
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic",
                "GoalCritic", "PathFollowCritic",
                "PathAlignCritic", "ObstaclesCritic"
                ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 3.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.6       #畏惧障碍物，调小不畏惧，原1.5
        critical_weight: 20.0       #畏惧障碍物，调小不畏惧，原20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.10   #畏惧障碍物，原0.25，机器人离障碍物多近才算碰撞；过大可能导致过于畏惧障碍物，过小可能导致碰撞；
        near_goal_distance: 0.1

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0           #畏惧障碍物，调小不畏惧，原3.8
        critical_cost: 253.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0    #走直线，提高这个值；走得更接近全局路径，原8.0
        offset_from_furthest: 5
        threshold_to_consider: 3.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0   #走直线，提高这个值；走得更接近全局路径，原15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 3.0
        offset_from_furthest: 20
        use_path_orientations: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.2
      footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: false    # 不追踪未知区域，局部地图未知空间不视为障碍
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.12  #地面高度过滤，0.12m
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.12        # 地面高度过滤；已调：local costmap 仅把相对地面高度不低于 10cm 的点标为障碍
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          sensor_frame: front_mid360      #根据仿真新加的，后续测试看看要不删除
          min_obstacle_height: 0.12  #地面高度过滤，0.12m
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.4   #离传感器原点多近的不算障碍
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0    #调大代价衰减更快，机器人更敢靠近障碍物；调小代价衰减更慢。
        inflation_radius: 0.3       #机器人离障碍物多近才算有代价；过大可能导致过于畏惧障碍物，过小可能导致碰撞；
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      robot_radius: 0.2
      footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      resolution: 0.05
      rolling_window: true
      width: 40
      height: 40
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: false  #不追踪未知区域，全局地图未知空间不视为障碍
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.12  #地面高度过滤，0.12m
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.13        # 地面高度过滤；已调：global costmap 仅把相对地面高度不低于 10cm 的点标为障碍
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map_ext
          sensor_frame: front_mid360    #根据仿真新加的，后续测试看看要不删除
          min_obstacle_height: 0.12  #地面高度过滤，0.12m
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.4   #离传感器原点多近的不算障碍
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.3
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 4.5
      cost_travel_multiplier: 4.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.05
      retrospective_penalty: 0.025
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 0.0
      cost_penalty: 2.0
      rotation_penalty: 5.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: True
      allow_reverse_expansion: True
      smooth_path: True
      smoother:
        max_iterations: 10000
        w_smooth: 0.4
        w_data: 0.1
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    smoother_plugins: ["savitzky_golay_smoother"]
    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      window_size: 7
      poly_order: 3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 2.0
    visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.5, 2.5, 2.5]
    min_velocity: [-2.5, -2.5, -2.5]
    deadband_velocity: [0.05, 0.05, 0.05]
    velocity_timeout: 1.0
    max_accel: [2.5, 2.5, 3.0]
    max_decel: [-3.5, -3.5, -3.0]
    odom_topic: "odometry"
    odom_duration: 0.1

pb_teleop_twist_joy_node:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: gimbal_yaw
    control_mode: auto_control    # Option: auto_control, manual_control

    require_enable_button: true
    enable_button: 4              # L1 shoulder button
    enable_turbo_button: 5        # R1 shoulder button

    axis_chassis:
      x: 1                        # Left thumb stick vertical
      y: 0                        # Left thumb stick horizontal
      yaw: 6                      # button_left and button_right
    scale_chassis:
      x: 2.5
      y: 2.5
      yaw: 3.0
    scale_chassis_turbo:
      x: 4.0
      y: 4.0
      yaw: 6.0

    axis_gimbal:
      roll: -1                    # Disable
      pitch: 4                    #  Right thumb stick vertical
      yaw: 3                      # Right thumb stick horizontal
    scale_gimbal:
      roll: 0.0
      pitch: -1.0
      yaw: 2.5
    scale_gimbal_turbo:
      roll: 0.0
      pitch: -1.5
      yaw: 3.5
