    #   curvature_forward_dist: 0.7                       # 前向距离，用于曲率计算
    #   curvature_backward_dist: 0.3                      # 后向距离，用于曲率计算
    #   max_velocity_scaling_factor_rate: 1.4             # 速度缩放因子的最大变化率

    FollowPath:
      plugin: "goal_approach_controller::GoalApproachController"
      inner_plugin: "nav2_mppi_controller::MPPIController"
      approach_distance: 0.8  #只在最后 0.8m 才限速，避免 1m 以上长时间爬行
      approach_velocity: 0.5  #接近目标时最大速度
      direct_approach_distance: 0.5  #最后 0.5m 直接朝目标点驱动，减少近目标粘滞
      direct_approach_kp: 2.0  #直接驱动P控制增益
      time_steps: 80  #增加到80，预测时域4.8s，让MPPI能看到冲过目标的后果
      model_dt: 0.06  #进一步拉长预测时域，降低多点导航时接近路点的绕圈倾向
      batch_size: 1200 #保留较高采样质量，同时把单周期计算压回 50Hz 预算内。

      vx_std: 0.35 #增大采样多样性，让MPPI能采到更多减速/停止轨迹
      vy_std: 0.35
      wz_std: 0.2

      vx_max: 2.5
      vy_max: 2.5
      wz_max: 1.5

      vx_min: -2.5
      vy_min: -2.5
      wz_min: -1.5

      ax_max: 1.5 #加速度提高，高速时能快速响应
      ay_max: 1.5
      az_max: 3.0

      ax_min: -3.5 #关键：制动力必须对称，高速下刹得住
      ay_min: -3.5
      az_min: -3.0

      iteration_count: 1
      prune_distance: 1.7 #高速下提前剪枝已通过的路径点
      transform_tolerance: 0.1
      temperature: 0.25 #大幅降低：让 MPPI 更果断选最优轨迹，不在次优之间摇摆
      gamma: 0.015 #稍微提高正则化，减少激进抖动
      motion_model: "Omni" #控制器的运动模型。
      visualize: false #是否可视化。
      reset_period: 0.08 # (only in Humble)
      retry_attempt_limit: 2 #软重置尝试次数，降低多点导航连续失败概率
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5 #是指在可视化轨迹时，每隔多少个轨迹点绘制一个点。
        time_step: 3 #是指在可视化轨迹时，每隔多少个时间步长绘制一个点。
      critics: ["ConstraintCritic", "CostCritic", 
                "GoalCritic", "PathFollowCritic", 
                "PathAlignCritic", "ObstaclesCritic"
                ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic: #必须开启，否则机器人没有到达目标的动力
        enabled: true
        cost_power: 1
        cost_weight: 20.0 #提高权重，增强最终接近阶段的目标吸引力，防止弧线绕圈
        threshold_to_consider: 3.0
      ObstaclesCritic: #开启提供额外的障碍物排斥力
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5 #排斥权重
        critical_weight: 20.0 #近距离障碍物惩罚
        consider_footprint: false #用圆形近似，omni机器人更高效
        collision_cost: 10000.0
        collision_margin_distance: 0.25 #碰撞边界余量
        near_goal_distance: 0.1

      CostCritic: #通过 costmap 梯度引导避障
        enabled: true
        cost_power: 1
        cost_weight: 3.8 #适当降低，配合修正后的 inflation 梯度
        critical_cost: 253.0 #关键修正！只有 inscribed/lethal 才触发碰撞惩罚，不再把整个膨胀区都当碰撞
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      PathFollowCritic: #必须开启，这是防止乱跑的核心
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 5 #关注路径前方更远的点
        threshold_to_consider: 3.0 #放大关闭距离，让GoalCritic在近目标区域主导，防止画弧

      PathAlignCritic: #让轨迹方向与路径对齐，高速下更平滑
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 3.0 #在接近路点前持续提供方向引导，减少多点切换时的圆周运动
        offset_from_furthest: 20
        use_path_orientations: false #omni机器人用运动方向而非朝向


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.2
      footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true    # 局部地图未知空间视为障碍
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.1 #地面高度过滤0.1m
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1 #地面高度过滤0.1m
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          sensor_frame: front_mid360    # 新添加，用于指定传感器坐标系，之前默认是 robot_base_frame，这样就能更准确地利用点云数据了
          min_obstacle_height: 0.1 #地面高度过滤0.1m
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.4   #离传感器原点多近的不算障碍
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0        # 控制势场衰减，越小衰减越慢，越不容易靠近墙体，官方默认10
        inflation_radius: 0.55          # 局部代价地图膨胀半径
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 20.0   # 原5.0，建图更快，规划器能更及时看到新区域；过高可占用 CPU资源
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      robot_radius: 0.2               # 导航碰撞半径
      footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      resolution: 0.05
      rolling_window: true             # 跟随机器人，机器人始终在地图内；避免越界崩溃
      width: 40                        # 40m 覆盖 RM 赛场 40m 宽
      height: 40                       # 40m 覆盖 RM 赛场 40m 高
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.1 #地面高度过滤0.1m
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1 #地面高度过滤0.1m；global costmap 仅把相对地面高度不低于 10cm 的点标为障碍
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map_ext
          sensor_frame: front_mid360
          min_obstacle_height: 0.1 #地面高度过滤0.1m
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.4   #离传感器原点多近的不算障碍
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # subscribe_to_updates: True
        # track_unknown_space: false
        # trinary_costmap: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.7          # 全局代价地图膨胀半径
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5                # 目标点容忍半径：目标点被障碍覆盖时，在0.5m内找最近可达点
      allow_unknown: true           # 允许在未知/障碍区域规划，避免动态障碍导致规划直接abort
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000             # 搜索的最大总迭代次数（如果无法到达），设置为-1以禁用
      max_on_approach_iterations: 1000    # 一旦在容差范围内，尝试到达目标的最大迭代次数
      max_planning_time: 4.5              # 规划、平滑和上采样的最大时间（秒）。将根据规划后的剩余时间缩放最大平滑和上采样时间。
      cost_travel_multiplier: 4.0         # For 2D: 应用于搜索的代价乘数，以避开高代价区域。较大的值将更精确地放置在通道的中心（如果存在非“FREE”代价势场），但计算时间稍长。为了优化速度，1.0是合理的值。合理的折衷值是2.0。0.0的值有效地禁用避开障碍物的功能，像一个简单的二进制搜索A*。
      motion_model_for_search: "DUBIN"    # For Hybrid Dubin, Redds-Shepp
      angle_quantization_bins: 72         # For Hybrid nodes: 搜索的角度桶数，对于2D节点必须为1（无角度搜索）
      analytic_expansion_ratio: 3.5       # For Hybrid/Lattice nodes: 在搜索过程中尝试解析扩展的比例，用于最终接近。
      analytic_expansion_max_length: 3.0  # For Hybrid/Lattice nodes: 解析扩展被认为有效的最大长度，以防止不安全的捷径（单位：米）。这应该与最小转弯半径成比例，不应小于最小半径的4-5倍。
      minimum_turning_radius: 0.05        # For Hybrid/Lattice nodes: 路径/车辆的最小转弯半径，单位：米
      retrospective_penalty: 0.025        # For Hybrid/Lattice nodes: 优先考虑路径上较晚的机动而不是较早的机动。节省搜索时间，因为较早的节点不会被扩展，直到有必要。必须 >= 0.0且 <= 1.0
      reverse_penalty: 1.0                # For Reeds-Shepp model: 应用于倒车的惩罚，必须 >= 1
      change_penalty: 0.0                 # For Hybrid nodes: 应用于改变方向的惩罚，必须 >= 0
      non_straight_penalty: 0.0          # For Hybrid nodes: 应用于非直线运动的惩罚，必须 >= 1
      cost_penalty: 2.0                   # For Hybrid nodes: 在将更高代价区域添加到障碍物地图动态规划距离扩展启发式时应用的惩罚。这将驱动机器人更靠近通道的中心。1.3 - 3.5 之间的值是合理的。
      rotation_penalty: 5.0               # For Lattice node: 仅在使用包含原地旋转原语的最小控制集时应用于纯原地旋转命令的惩罚。除非严格必要用于避开障碍物，否则应始终设置足够高的权重，以避免此操作，否则可能会在路径中频繁出现不连续的情况，要求机器人原地旋转以节省路径距离。
      lookup_table_size: 20.0             # For Hybrid nodes: 缓存的dubin/reeds-sheep距离窗口的大小，单位：米。
      cache_obstacle_heuristic: True      # For Hybrid nodes: 在同一目标位置的后续重新规划之间缓存障碍物地图动态规划距离扩展启发式。如果代价地图基本静态，则显著加快重新规划性能（40倍）。
      allow_reverse_expansion: True      # For Lattice node: 是否在前向原语或反向扩展状态格子图中扩展，将使每一步的分支因子加倍。
      smooth_path: True                   # For Lattice/Hybrid nodes: 是否平滑路径，对于2D节点始终为 true。
      smoother:
        max_iterations: 10000
        w_smooth: 0.4
        w_data: 0.1
        tolerance: 1.0e-10
        do_refinement: true

# 路径平滑器，将全局路径折线平滑成曲线
smoother_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    smoother_plugins: ["savitzky_golay_smoother"]
    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      window_size: 7
      poly_order: 3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 2.0
    visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.5, 2.5, 2.5] #与 MPPI 限速一致，不再截断高速输出
    min_velocity: [-2.5, -2.5, -2.5]
    deadband_velocity: [0.05, 0.05, 0.05]
    velocity_timeout: 1.0
    max_accel: [2.5, 2.5, 3.0] #与 MPPI 加速度一致
    max_decel: [-3.5, -3.5, -3.0] #与 MPPI 制动一致
    odom_topic: "Odometry"
    odom_duration: 0.1

pb_teleop_twist_joy_node:
  ros__parameters:
    use_sim_time: True
    robot_base_frame: gimbal_yaw
    control_mode: auto_control    # Option: auto_control, manual_control

    require_enable_button: true
    enable_button: 4              # L1 shoulder button
    enable_turbo_button: 5        # R1 shoulder button

    axis_chassis:
      x: 1                        # Left thumb stick vertical
      y: 0                        # Left thumb stick horizontal
      yaw: 6                      # button_left and button_right
    scale_chassis:
      x: 2.5
      y: 2.5
      yaw: 3.0
    scale_chassis_turbo:
      x: 4.0
      y: 4.0
      yaw: 6.0

    axis_gimbal:
      roll: -1                    # Disable
      pitch: 4                    # Right thumb stick vertical
      yaw: 3                      # Right thumb stick horizontal
    scale_gimbal:
      roll: 0.0
      pitch: -1.0
      yaw: 2.5
    scale_gimbal_turbo:
      roll: 0.0
      pitch: -1.5
      yaw: 3.5
